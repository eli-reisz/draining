<!--
  Paste these lines inside the <head> section of every page on the Draining website.
  Put all the logo files in the website's main (root) folder so the "/file_name" paths work.
  Replace https://www.YOURDOMAIN.com with the real website address.
-->

<!-- Browser tab icon: modern browsers use the SVG, older ones fall back to the .ico -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">

<!-- Icon used when someone saves the site to their iPhone/iPad home screen -->
<link rel="apple-touch-icon" href="/apple_touch_icon_180.png">

<!-- Android home screen icons are listed inside this file -->
<link rel="manifest" href="/site.webmanifest">

<!-- Colors the browser bar on phones navy to match the brand -->
<meta name="theme-color" content="#1B2A4A">

<!-- Preview card shown when the site link is shared (Facebook, iMessage, LinkedIn, etc.) -->
<meta property="og:title" content="Draining Plumbing Co.">
<meta property="og:image" content="https://www.YOURDOMAIN.com/social_share_1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">


<!-- ===== Logo in the page itself (goes in <body>, not <head>) ===== -->

<!-- Header logo: SVG stays sharp at any size; width controls how big it shows -->
<img src="/draining_logo_header.svg" alt="Draining Plumbing Co." width="250">

<!-- Footer logo: white version, use on a dark (navy) background -->
<img src="/draining_logo_footer_white.svg" alt="Draining Plumbing Co." width="200">
